- description: Intent recipe complete private StudyRoom in English
  vars:
    caseId: intent_private_study_room_en
    cohort: intent_recipe
    knownRecipe: true
    completeRequest: true
    equivalenceGroup: private_study_room_en_default
    request: |-
      {
        "schema_version": 3,
        "mode": "intent_recipe",
        "turns": [
          {
            "id": "build",
            "input": "Build a managed private study-room automation and prepare its validated preview. Use English default copy and naming, use the existing channel binding community_hub as the discovery hub, and leave room closing disabled. All material choices are provided, so do not ask a follow-up question."
          }
        ]
      }
    expectedOutcomes: ready
    expectedStagePath: empty>preview_ready
    expectedRoutePath: private_study_room
    expectedFinalStatus: preview_ready
    expectedCompiledOperations: 22
    expectedRestartCount: 0
    expectedBlockers: ""
    expectedBoundaryViolations: ""
    expectedRulesetPathValues: '{"/panels/0/content":"Create a study room","/panels/0/buttons/0/label":"Create room","/modals/0/title":"Create study room","/modals/0/fields/0/label":"Room name","/rules/1/actions/1/name":"${input.room_name} members","/rules/1/actions/2/name":"study-${input.room_name}","/rules/1/actions/6/content":"Welcome to ${input.room_name}","/rules/1/actions/6/buttons/0/label":"Help","/rules/1/actions/7/content":"${input.room_name} is open","/rules/1/actions/7/buttons/0/label":"Join","/rules/1/actions/9/content":"Created ${input.room_name}","/rules/2/actions/0/content":"This is a private study room","/rules/3/actions/2/content":"Joined the study room"}'
    expectedRulesetAbsentPaths: '["/rules/1/actions/6/buttons/1","/rules/4"]'
  assert:
    - type: javascript
      value: file://intent-assertions.js:intentProvenance
    - type: javascript
      value: file://intent-assertions.js:intentRouteStage
    - type: javascript
      value: file://intent-assertions.js:intentReceipt
    - type: javascript
      value: file://intent-assertions.js:intentOneCallTurns
    - type: javascript
      value: file://intent-assertions.js:intentOracleIsolation
    - type: javascript
      value: file://intent-assertions.js:intentDecisionFlow
    - type: javascript
      value: file://intent-assertions.js:intentAdjudicationDecision
    - type: javascript
      value: file://intent-assertions.js:intentRestartContinuity
    - type: javascript
      value: file://intent-assertions.js:intentNoMutationFallback
    - type: javascript
      value: file://intent-assertions.js:intentRulesetPathValues
    - type: javascript
      value: file://intent-assertions.js:intentHardLatency

