- description: Complete one-shot feedback design
  vars:
    caseId: complete_one_shot
    request: |-
      {
        "schema_version": 1,
        "turns": [
          {
            "id": "complete-request",
            "input": "Discord 자동화 Draft를 한 번에 완성해줘. key=feedback_modal, title=Feedback인 모달을 선언하고 required paragraph 필드 key=message, label=Message를 넣어라. key=ack_feedback 규칙은 feedback_modal 제출로 시작하고, ephemeral defer 후 Thanks, ${input.message}로 응답을 수정한다. 다른 패널이나 규칙이나 action은 만들지 말고 현재 revision을 validate해서 미리보기 가능한 준비 상태로 끝내라. 필요한 정보는 모두 주어졌으므로 추가 질문하지 마라."
          }
        ]
      }
    expectedOutcomes: "ready,completed"
    inputTurnCount: 1
    minChangedTurns: 1
    requireSimulation: false
    requireActualValidation: true
    requireActualSimulation: false
    expectedPanels: 0
    expectedModals: 1
    expectedRules: 1
    expectedActions: 2
    minDistinctMutationTools: 3
    maxModelCalls: 12
    maxToolCalls: 24
    maxModelCallsPerTurn: 12
    maxToolCallsPerTurn: 24
  assert:
    - type: javascript
      value: file://assertions.js:terminalOutcome
    - type: javascript
      value: file://assertions.js:conversationFlow
    - type: javascript
      value: file://assertions.js:actualGateStamps
    - type: javascript
      value: file://assertions.js:finalGates
    - type: javascript
      value: file://assertions.js:draftShape
    - type: javascript
      value: file://assertions.js:taskSemantics
    - type: javascript
      value: file://assertions.js:distinctMutationTools
    - type: javascript
      value: file://assertions.js:noExcessiveRepeatedErrors
    - type: javascript
      value: file://assertions.js:callBudgets
    - type: javascript
      value: file://assertions.js:perTurnBudgets

- description: Ambiguous request asks one blocking question
  vars:
    caseId: ambiguous_clarification
    request: |-
      {
        "schema_version": 1,
        "turns": [
          {
            "id": "ambiguous-request",
            "input": "친구들이 사용할 Discord 스터디룸 자동화를 만들고 싶어. 공개 범위와 참가 방식처럼 구조를 바꾸는 정보가 부족하면 임의로 확정하지 말고 가장 중요한 질문 하나만 자연스럽게 물어봐."
          }
        ]
      }
    expectedOutcomes: "needs_input,awaiting_human"
