[package]
name = "authoring-application-postgres"
version = "0.1.0"
edition.workspace = true

[dependencies]
authoring-application = { path = "../authoring-application" }
authoring-promotion = { path = "../authoring-promotion" }
automation-ruleset = { path = "../automation-ruleset" }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
design-harness = { path = "../design-harness" }
desired-state = { path = "../desired-state" }
discord-model = { path = "../discord-model" }
resource-resolution = { path = "../resource-resolution" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "derive", "macros", "migrate"] }
thiserror = { workspace = true }
zeroize = "1"

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
