[package]
name = "automation-runtime-convergence-postgres"
version = "0.1.0"
edition.workspace = true

[dependencies]
automation-core = { path = "../automation-core" }
automation-runtime-convergence = { path = "../automation-runtime-convergence" }
automation-runtime-controller = { path = "../automation-runtime-controller" }
automation-ruleset = { path = "../automation-ruleset" }
automation-state = { path = "../automation-state" }
desired-state = { path = "../desired-state" }
discord-model = { path = "../discord-model" }
resource-resolution = { path = "../resource-resolution" }
chrono = { version = "0.4", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "derive", "macros", "migrate"] }
thiserror = { workspace = true }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
