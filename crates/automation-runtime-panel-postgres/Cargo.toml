[package]
name = "automation-runtime-panel-postgres"
version = "0.1.0"
edition.workspace = true

[dependencies]
automation-core = { path = "../automation-core" }
automation-panel-installation = { path = "../automation-panel-installation" }
automation-ruleset = { path = "../automation-ruleset" }
automation-runtime-controller = { path = "../automation-runtime-controller" }
automation-runtime-convergence = { path = "../automation-runtime-convergence" }
automation-runtime-convergence-postgres = { path = "../automation-runtime-convergence-postgres" }
chrono = "0.4"
discord-model = { path = "../discord-model" }
getrandom = "0.4"
resource-resolution = { path = "../resource-resolution" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "derive"] }
thiserror = { workspace = true }
tokio = { version = "1", features = ["sync"] }
