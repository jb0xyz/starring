[package]
name = "automation-runtime-serving-postgres"
version = "0.1.0"
edition.workspace = true

[dependencies]
automation-runtime-controller = { path = "../automation-runtime-controller" }
chrono = "0.4"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "derive", "macros", "migrate"] }
thiserror = { workspace = true }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
automation-ruleset = { path = "../automation-ruleset" }
automation-runtime-convergence = { path = "../automation-runtime-convergence" }
discord-model = { path = "../discord-model" }
resource-resolution = { path = "../resource-resolution" }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
