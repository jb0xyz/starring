[package]
name = "starring-staging-authority-operator"
version = "0.1.0"
edition.workspace = true

[dependencies]
desired-state = { path = "../../crates/desired-state" }
discord-model = { path = "../../crates/discord-model" }
resource-resolution = { path = "../../crates/resource-resolution" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "derive"] }
thiserror = { workspace = true }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
zeroize = "1"
