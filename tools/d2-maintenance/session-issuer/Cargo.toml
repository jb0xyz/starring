[package]
name = "starring-d2-session-issuer"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
getrandom = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "postgres", "runtime-tokio-rustls"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
zeroize = "1"
