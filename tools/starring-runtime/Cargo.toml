[package]
name = "starring-runtime"
version = "0.1.0"
edition.workspace = true

[dependencies]
automation-runtime-convergence-postgres = { path = "../../crates/automation-runtime-convergence-postgres" }
automation-runtime-execution-postgres = { path = "../../crates/automation-runtime-execution-postgres" }
automation-runtime-interaction-postgres = { path = "../../crates/automation-runtime-interaction-postgres" }
automation-runtime-panel-postgres = { path = "../../crates/automation-runtime-panel-postgres" }
automation-runtime-serving-postgres = { path = "../../crates/automation-runtime-serving-postgres" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
thiserror.workspace = true
tokio = { version = "1", default-features = false, features = ["macros", "sync", "time"] }
zeroize = "1"

[dev-dependencies]
serde_json.workspace = true
