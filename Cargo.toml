[workspace]
members = [
    "crates/discord-model",
    "crates/domain",
    "crates/desired-state",
    "crates/desired-compiler",
    "crates/diff-engine",
    "crates/operation-graph",
    "crates/ai-gateway",
    "crates/policy-engine",
    "crates/simulator",
    "crates/virtual-apply",
    "crates/preview",
    "crates/approval-manager",
    "crates/resource-resolution",
    "crates/executor-core",
    "crates/bot-runtime",
    "crates/automation-state",
    "crates/automation-core",
    "crates/automation-runtime",
    "crates/automation-instance",
    "crates/automation-instance-postgres",
    "crates/automation-ruleset",
    "tools/ai-eval",
    "tools/executor-smoke",
    "tools/starring-demo",
    "tools/interaction-smoke",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = "2"
thiserror = "1"
