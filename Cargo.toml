[workspace]
members = [
    "crates/discord-model",
    "crates/domain",
    "crates/desired-state",
    "crates/desired-compiler",
    "crates/diff-engine",
    "crates/operation-graph",
    "crates/ai-gateway",
    "crates/policy-engine",
    "crates/simulator",
    "crates/virtual-apply",
    "crates/preview",
    "crates/approval-manager",
    "crates/resource-resolution",
    "crates/executor-core",
    "crates/bot-runtime",
    "crates/automation-state",
    "crates/automation-spec",
    "crates/automation-stateful-spec",
    "crates/automation-stateful-compiler",
    "crates/automation-stateful-runtime",
    "crates/automation-core",
    "crates/design-harness",
    "crates/design-harness-codex-worker-client",
    "crates/authoring-promotion",
    "crates/authoring-promotion-postgres",
    "crates/authoring-application",
    "crates/authoring-application-discord",
    "crates/authoring-application-postgres",
    "crates/product-control-http",
    "crates/automation-runtime",
    "crates/automation-runtime-convergence",
    "crates/automation-runtime-controller",
    "crates/automation-runtime-worker",
    "crates/automation-runtime-registry",
    "crates/automation-runtime-effect-contract",
    "crates/automation-runtime-convergence-postgres",
    "crates/automation-runtime-execution-postgres",
    "crates/automation-runtime-serving-postgres",
    "crates/automation-runtime-interaction",
    "crates/automation-runtime-interaction-postgres",
    "crates/automation-runtime-panel-postgres",
    "crates/automation-runtime-panel-evidence",
    "crates/automation-instance",
    "crates/automation-instance-postgres",
    "crates/automation-instance-teardown",
    "crates/automation-ruleset",
    "crates/automation-ruleset-postgres",
    "crates/automation-ruleset-readiness",
    "crates/automation-ruleset-dispatch",
    "crates/automation-ruleset-activation",
    "crates/automation-ruleset-activation-postgres",
    "crates/automation-panel-installation",
    "crates/automation-panel-installation-postgres",
    "tools/ai-eval",
    "tools/executor-smoke",
    "tools/starring-demo",
    "tools/interaction-smoke",
    "tools/design-harness",
    "tools/starring-api",
    "tools/starring-db-bootstrap",
    "tools/starring-runtime",
    "tools/starring-staging-provisioner",
    "tools/starring-staging-authority-operator",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = "2"
thiserror = "1"
