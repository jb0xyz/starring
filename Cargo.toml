[workspace]
members = [
    "crates/discord-model",
    "crates/domain",
    "crates/desired-state",
    "crates/desired-compiler",
    "crates/diff-engine",
    "crates/operation-graph",
    "crates/ai-gateway",
    "crates/policy-engine",
    "tools/ai-eval",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = "2"
thiserror = "1"
